<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Two ledgers have the same 1900 dollar balance but different invoice and payment amounts"><rect width="900" height="330" fill="white"/><g fill="#252a2d" font-family="system-ui,sans-serif"><text x="30" y="46" font-family="Georgia,serif" font-size="30">The balance matches. The ledger does not.</text><text x="30" y="79" font-size="16" fill="#596260">Simulated L-104: duplicate invoice, corrected payment, late old snapshot.</text><text x="30" y="134" font-size="16">Accounting measure</text><text x="380" y="134" font-size="16">Add every arrival</text><text x="640" y="134" font-size="16">Current snapshot</text><path d="M30 148H865 M30 198H865 M30 248H865" stroke="#d5dcd8"/><g font-size="23"><text x="30" y="183">Invoiced</text><text x="380" y="183" fill="#a3482c">$4,800</text><text x="640" y="183">$2,400</text><text x="30" y="233">Paid</text><text x="380" y="233" fill="#a3482c">$2,900</text><text x="640" y="233">$500</text><text x="30" y="283">Balance</text><text x="380" y="283">$1,900</text><text x="640" y="283">$1,900</text></g></g></svg>
